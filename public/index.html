<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MOCAB User Management</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  section { margin-bottom: 32px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; }
  input, select, button { padding: 8px; margin: 4px 4px 4px 0; }
  button { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  #status { font-size: 0.85rem; color: #555; }
  .error { color: #c0392b; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>MOCAB — Gerenciamento de Usuários</h1>
<p id="status">Não autenticado.</p>

<section id="login-section">
  <h2>Login</h2>
  <input id="login-email" placeholder="e-mail" type="email">
  <input id="login-password" placeholder="senha" type="password">
  <button onclick="login()">Entrar</button>
  <p id="login-error" class="error"></p>
</section>

<section id="app-section" class="hidden">
  <h2>Criar usuário</h2>
  <button onclick="logout()" style="float:right;">Sair</button>
  <input id="create-name" placeholder="nome">
  <input id="create-email" placeholder="e-mail" type="email">
  <input id="create-password" placeholder="senha" type="password">
  <select id="create-role">
    <option value="USER">USER</option>
    <option value="ADMIN">ADMIN</option>
  </select>
  <button onclick="createUser()">Criar</button>
  <p id="create-error" class="error"></p>

  <h2>Usuários</h2>
  <button onclick="loadUsers()">Atualizar lista</button>
  <table>
    <thead>
      <tr><th>Nome</th><th>E-mail</th><th>Cargo</th><th>Ações</th></tr>
    </thead>
    <tbody id="users-table-body"></tbody>
  </table>
</section>

<script>
  let token = localStorage.getItem('token') || null;
  let currentRole = null;

  function decodeRole(jwt) {
    try {
      const payload = JSON.parse(atob(jwt.split('.')[1]));
      return payload.role;
    } catch {
      return null;
    }
  }

  function setStatus(text) {
    document.getElementById('status').textContent = text;
  }

  function showApp() {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
  }

  async function login() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    document.getElementById('login-error').textContent = '';

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Falha no login');

      token = data.token;
      localStorage.setItem('token', token);
      currentRole = decodeRole(token);
      setStatus(`Autenticado como ${email} (${currentRole})`);
      showApp();
      loadUsers();
    } catch (err) {
      document.getElementById('login-error').textContent = err.message;
    }
  }

  function logout() {
    token = null;
    currentRole = null;
    localStorage.removeItem('token');
    document.getElementById('app-section').classList.add('hidden');
    document.getElementById('login-section').classList.remove('hidden');
    setStatus('Não autenticado.');
    }

  async function apiFetch(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: {
        ...(options.headers || {}),
        Authorization: `Bearer ${token}`,
      },
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Erro ${res.status}`);
    return data;
  }

  async function loadUsers() {
    try {
      const users = await apiFetch('/users');
      const tbody = document.getElementById('users-table-body');
      tbody.innerHTML = '';
      users.forEach((u) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${u.role}</td>
          <td>
            <button onclick="promptUpdate('${u.id}', '${u.name}')">Editar</button>
            <button onclick="toggleRole('${u.id}', '${u.role}')">Mudar cargo</button>
            <button onclick="removeUser('${u.id}')">Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    } catch (err) {
      setStatus(`Erro ao carregar usuários: ${err.message}`);
    }
  }

  async function createUser() {
    const name = document.getElementById('create-name').value;
    const email = document.getElementById('create-email').value;
    const password = document.getElementById('create-password').value;
    const role = document.getElementById('create-role').value;
    document.getElementById('create-error').textContent = '';

    try {
      await fetch('/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, role }),
      }).then(async (res) => {
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao criar');
      });
      loadUsers();
    } catch (err) {
      document.getElementById('create-error').textContent = err.message;
    }
  }

  async function promptUpdate(id, currentName) {
    const newName = prompt('Novo nome:', currentName);
    if (newName === null) return;
    try {
      await apiFetch(`/users/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: newName }),
      });
      loadUsers();
    } catch (err) {
      alert(err.message);
    }
  }

  async function toggleRole(id, current) {
    const newRole = current === 'ADMIN' ? 'USER' : 'ADMIN';
    if (!confirm(`Mudar cargo para ${newRole}?`)) return;
    try {
      await apiFetch(`/users/${id}/role`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: newRole }),
      });
      loadUsers();
    } catch (err) {
      alert(err.message);
    }
  }

  async function removeUser(id) {
    if (!confirm('Excluir este usuário?')) return;
    try {
      await apiFetch(`/users/${id}`, { method: 'DELETE' });
      loadUsers();
    } catch (err) {
      alert(err.message);
    }
  }

  // Se já tinha token salvo de uma sessão anterior, tenta usar direto
  if (token) {
    currentRole = decodeRole(token);
    setStatus(`Autenticado (${currentRole})`);
    showApp();
    loadUsers();
  }
</script>

</body>
</html>
